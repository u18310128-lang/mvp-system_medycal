<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Su cita — Consultorio Perú Ruso</title>
<style>
:root {
  --ground: #F3F5F5;
  --surface: #FFFFFF;
  --surface-2: #EDF1F1;
  --ink: #16211F;
  --ink-2: #45524F;
  --muted: #77857F;
  --line: #DCE3E2;
  --line-strong: #BAC6C3;
  --accent: #0E5D50;
  --accent-2: #146F5F;
  --accent-soft: #E2EEEB;
  --alert: #A6392B;
  --alert-soft: #F8E9E6;
  --ok: #1D6B3F;
  --ok-soft: #E4F1E9;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101514; --surface: #181E1D; --surface-2: #202726;
    --ink: #E5EAE9; --ink-2: #C0C9C7; --muted: #8C9995;
    --line: #2A3231; --line-strong: #3E4A47;
    --accent: #4FB8A2; --accent-2: #6BC9B5; --accent-soft: #10302A;
    --alert: #E28270; --alert-soft: #37211D;
    --ok: #63B685; --ok-soft: #14301F;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding: 18px 14px 40px;
}

.hoja { max-width: 460px; margin: 0 auto; }

.marca {
  display: flex; align-items: center; gap: 11px;
  margin-bottom: 18px;
}
.marca .m {
  width: 38px; height: 38px; display: grid; place-items: center;
  background: var(--accent); color: #fff; border-radius: 5px;
  font-weight: 700; font-size: 14px; letter-spacing: .03em;
}
.marca h1 { margin: 0; font-size: 15px; font-weight: 650; }
.marca p { margin: 0; font-size: 12px; color: var(--muted); }

.tarjeta {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 22px 20px;
  margin-bottom: 14px;
}

.saludo { font-size: 15px; color: var(--ink-2); margin: 0 0 16px; }
.saludo b { color: var(--ink); }

.detalle { display: grid; gap: 12px; margin-bottom: 4px; }
.dato {
  display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: baseline;
}
.dato .et {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
}
.dato .vl { font-size: 16px; font-weight: 600; }
.dato .vl.grande { font-size: 22px; letter-spacing: -0.01em; }

.estado-chip {
  display: inline-block; margin-top: 16px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .07em;
  padding: 4px 10px; border-radius: 3px; border: 1px solid currentColor;
}
.e-PROGRAMADA { color: var(--ink-2); }
.e-CONFIRMADA { color: var(--ok); background: var(--ok-soft); }
.e-CANCELADA, .e-REPROGRAMADA { color: var(--muted); }
.e-AUSENTE { color: var(--alert); background: var(--alert-soft); }

.acciones { display: grid; gap: 9px; }

button {
  font: inherit; font-size: 15px; font-weight: 600;
  padding: 14px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface);
  color: var(--ink-2); width: 100%;
}
button:active { transform: translateY(1px); }
.principal { background: var(--accent); border-color: var(--accent); color: #fff; }
.principal:hover { background: var(--accent-2); }
.peligro { color: var(--alert); }
.peligro:hover { border-color: var(--alert); }
button:disabled { opacity: .5; cursor: not-allowed; }

.aviso {
  padding: 14px 16px; border-radius: 6px; font-size: 14.5px;
  border: 1px solid currentColor; margin-bottom: 14px;
}
.aviso.ok { color: var(--ok); background: var(--ok-soft); }
.aviso.mal { color: var(--alert); background: var(--alert-soft); }
.aviso b { display: block; margin-bottom: 3px; }

/* --- reprogramar --- */
.dia { margin-bottom: 16px; }
.dia h3 {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
  margin: 0 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
}
.horas { display: flex; flex-wrap: wrap; gap: 7px; }
.hora {
  font-family: var(--mono); font-size: 13.5px; font-weight: 500;
  padding: 9px 13px; width: auto; min-width: 0;
}
.hora.sel { background: var(--accent); border-color: var(--accent); color: #fff; }

.scroll-cupos { max-height: 52vh; overflow-y: auto; margin-bottom: 14px; }

.pie {
  font-size: 11.5px; color: var(--muted); text-align: center;
  margin-top: 20px; line-height: 1.5;
}
.pie a { color: var(--muted); }

.cargando { text-align: center; padding: 50px 0; color: var(--muted); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<div class="hoja">

  <div class="marca">
    <span class="m">PR</span>
    <div>
      <h1>Consultorio Perú Ruso</h1>
      <p>Confirmación de cita</p>
    </div>
  </div>

  <div id="cargando" class="cargando">Cargando su cita…</div>

  <!-- ===== vista principal ===== -->
  <div id="vista" hidden>
    <div id="mensaje" class="aviso" hidden></div>

    <div class="tarjeta">
      <p class="saludo">Hola <b id="paciente"></b>, esta es su cita:</p>
      <div class="detalle">
        <div class="dato"><span class="et">Fecha</span><span class="vl grande" id="fecha"></span></div>
        <div class="dato"><span class="et">Hora</span><span class="vl grande" id="hora"></span></div>
        <div class="dato"><span class="et">Médico</span><span class="vl" id="medico"></span></div>
      </div>
      <span id="estado" class="estado-chip"></span>
    </div>

    <div class="acciones" id="acciones">
      <button id="btn-confirmar" class="principal" hidden>Confirmar mi asistencia</button>
      <button id="btn-reprogramar" hidden>Cambiar fecha u hora</button>
      <button id="btn-cancelar" class="peligro" hidden>No podré asistir</button>
    </div>
  </div>

  <!-- ===== reprogramar ===== -->
  <div id="vista-cupos" hidden>
    <div class="tarjeta">
      <p class="saludo">Elija el nuevo horario con <b id="medico-2"></b></p>
      <div class="scroll-cupos" id="cupos"></div>
      <div class="acciones">
        <button id="btn-guardar" class="principal" disabled>Confirmar cambio</button>
        <button id="btn-volver">Volver</button>
      </div>
    </div>
  </div>

  <p class="pie">
    Este enlace es personal y vence a la hora de su cita.<br>
    <a href="#" id="btn-baja">No deseo recibir más recordatorios</a>
  </p>

</div>

<script>
const $ = (s) => document.querySelector(s);
const TOKEN = location.pathname.split("/").pop();
const API = `/api/publico/cita/${TOKEN}`;

let horarioElegido = null;

async function llamar(url, opciones) {
  const r = await fetch(url, opciones);
  const cuerpo = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(cuerpo.error ?? "No se pudo completar la operación.");
  return cuerpo;
}

function aviso(texto, titulo, tipo = "ok") {
  const el = $("#mensaje");
  el.className = `aviso ${tipo}`;
  el.innerHTML = titulo ? `<b>${titulo}</b>${texto}` : texto;
  el.hidden = false;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function pintar(c) {
  $("#paciente").textContent = c.paciente;
  $("#fecha").textContent = c.fecha;
  $("#hora").textContent = c.hora;
  $("#medico").textContent = c.medico;
  $("#medico-2").textContent = c.medico;

  const etiquetas = {
    PROGRAMADA: "PENDIENTE DE CONFIRMAR",
    CONFIRMADA: "CONFIRMADA",
    CANCELADA: "CANCELADA",
    REPROGRAMADA: "REPROGRAMADA",
    ATENDIDA: "ATENDIDA",
    AUSENTE: "NO ASISTIÓ",
  };
  $("#estado").textContent = etiquetas[c.estado] ?? c.estado;
  $("#estado").className = `estado-chip e-${c.estado}`;

  $("#btn-confirmar").hidden = !c.puede_confirmar;
  $("#btn-reprogramar").hidden = !c.puede_reprogramar;
  $("#btn-cancelar").hidden = !c.puede_cancelar;

  if (c.vencido) {
    aviso("La hora de su cita ya pasó, por lo que este enlace dejó de estar disponible.", "Enlace vencido", "mal");
  } else if (c.estado === "CONFIRMADA") {
    aviso("Lo esperamos en la fecha y hora indicadas.", "Su asistencia está confirmada");
  } else if (c.estado === "CANCELADA") {
    aviso("Si desea una nueva cita, comuníquese con el consultorio.", "Cita cancelada", "mal");
  } else if (c.estado === "REPROGRAMADA") {
    aviso("Esta cita fue movida a una nueva fecha.", "Cita reprogramada");
  }

  $("#cargando").hidden = true;
  $("#vista").hidden = false;
}

async function cargar() {
  try {
    pintar(await llamar(API));
  } catch (error) {
    $("#cargando").innerHTML =
      `<div class="aviso mal"><b>Enlace no válido</b>${error.message}</div>`;
  }
}

/* ---------- confirmar ---------- */
$("#btn-confirmar").addEventListener("click", async (e) => {
  e.target.disabled = true;
  try {
    await llamar(`${API}/confirmar`, { method: "POST" });
    await cargar();
  } catch (error) {
    aviso(error.message, "No se pudo confirmar", "mal");
    e.target.disabled = false;
  }
});

/* ---------- cancelar ---------- */
$("#btn-cancelar").addEventListener("click", async (e) => {
  if (!confirm("¿Confirma que no podrá asistir a su cita?")) return;
  e.target.disabled = true;
  try {
    const r = await llamar(`${API}/cancelar`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ motivo: "Cancelación desde el enlace" }),
    });
    await cargar();
    if (r.cupo_reasignable) {
      aviso("Gracias por avisarnos con tiempo: su horario podrá ser usado por otro paciente.", "Cita cancelada");
    }
  } catch (error) {
    aviso(error.message, "No se pudo cancelar", "mal");
    e.target.disabled = false;
  }
});

/* ---------- reprogramar ---------- */
$("#btn-reprogramar").addEventListener("click", async () => {
  $("#vista").hidden = true;
  $("#vista-cupos").hidden = false;
  $("#cupos").innerHTML = `<p class="cargando">Buscando horarios…</p>`;

  try {
    const { cupos } = await llamar(`${API}/cupos`);
    if (!cupos.length) {
      $("#cupos").innerHTML =
        `<div class="aviso mal"><b>Sin horarios disponibles</b>No hay cupos libres en los próximos días. Comuníquese con el consultorio.</div>`;
      return;
    }

    const porDia = {};
    for (const c of cupos) (porDia[c.fecha_corta] ??= []).push(c);

    $("#cupos").innerHTML = Object.entries(porDia)
      .map(([dia, lista]) => `
        <div class="dia">
          <h3>${dia}</h3>
          <div class="horas">
            ${lista.map((c) => `<button class="hora" data-inicio="${c.inicio}">${c.hora}</button>`).join("")}
          </div>
        </div>`)
      .join("");

    $("#cupos").querySelectorAll(".hora").forEach((b) => {
      b.addEventListener("click", () => {
        $("#cupos").querySelectorAll(".hora").forEach((x) => x.classList.remove("sel"));
        b.classList.add("sel");
        horarioElegido = b.dataset.inicio;
        $("#btn-guardar").disabled = false;
      });
    });
  } catch (error) {
    $("#cupos").innerHTML = `<div class="aviso mal">${error.message}</div>`;
  }
});

$("#btn-volver").addEventListener("click", () => {
  $("#vista-cupos").hidden = true;
  $("#vista").hidden = false;
  horarioElegido = null;
  $("#btn-guardar").disabled = true;
});

$("#btn-guardar").addEventListener("click", async (e) => {
  e.target.disabled = true;
  e.target.textContent = "Guardando…";
  try {
    const r = await llamar(`${API}/reprogramar`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ inicio: horarioElegido }),
    });
    $("#vista-cupos").hidden = true;
    $("#vista").hidden = false;
    await cargar();
    aviso(`Su nueva cita quedó registrada para el ${r.fecha} a las ${r.hora}.`, "Cita reprogramada");
  } catch (error) {
    aviso(error.message, "No se pudo reprogramar", "mal");
    $("#vista-cupos").hidden = true;
    $("#vista").hidden = false;
  } finally {
    e.target.textContent = "Confirmar cambio";
  }
});

/* ---------- baja ---------- */
$("#btn-baja").addEventListener("click", async (e) => {
  e.preventDefault();
  if (!confirm("¿Desea dejar de recibir recordatorios de sus citas?")) return;
  try {
    await llamar(`${API}/baja`, { method: "POST" });
    aviso("No volveremos a enviarle recordatorios. Su cita sigue vigente.", "Baja registrada");
  } catch (error) {
    aviso(error.message, "No se pudo procesar la baja", "mal");
  }
});

cargar();
</script>
</body>
</html>
