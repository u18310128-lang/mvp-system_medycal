<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Diagrama de estados de la cita médica: desde los estados activos PROGRAMADA y CONFIRMADA, la cita puede pasar a ATENDIDA, AUSENTE, CANCELADA o REPROGRAMADA; los dos últimos liberan el cupo hacia la lista de espera.">

  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3C4744"/>
    </marker>
    <marker id="flechaRoja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A6392B"/>
    </marker>
    <marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E5D50"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="470" fill="#FFFFFF"/>

  <!-- ============ grupo: estados activos ============ -->
  <rect x="50" y="50" width="420" height="140" rx="6"
        fill="#F4F7F7" stroke="#B8C4C7" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="64" y="72" font-size="10.5" fill="#6B7773" letter-spacing="1.2">ESTADOS ACTIVOS · OCUPAN EL CUPO DEL MÉDICO</text>

  <!-- inicio -->
  <circle cx="28" cy="117" r="7" fill="#16211F"/>
  <path d="M 37 117 L 74 117" stroke="#3C4744" stroke-width="1.6" fill="none" marker-end="url(#flecha)"/>

  <!-- PROGRAMADA -->
  <rect x="80" y="90" width="160" height="54" rx="27" fill="#FFFFFF" stroke="#0E5D50" stroke-width="1.6"/>
  <text x="160" y="114" font-size="13.5" font-weight="600" fill="#16211F" text-anchor="middle">PROGRAMADA</text>
  <text x="160" y="130" font-size="10.5" fill="#6B7773" text-anchor="middle">recordatorios activos</text>

  <!-- CONFIRMADA -->
  <rect x="290" y="90" width="160" height="54" rx="27" fill="#E1EEEA" stroke="#0E5D50" stroke-width="1.6"/>
  <text x="370" y="114" font-size="13.5" font-weight="600" fill="#0E5D50" text-anchor="middle">CONFIRMADA</text>
  <text x="370" y="130" font-size="10.5" fill="#47555A" text-anchor="middle">responde el paciente</text>

  <path d="M 244 117 L 285 117" stroke="#0E5D50" stroke-width="1.6" fill="none" marker-end="url(#flechaVerde)"/>
  <text x="264" y="108" font-size="10.5" fill="#0E5D50" text-anchor="middle">confirma</text>

  <!-- ============ terminales de cierre del día ============ -->

  <!-- ATENDIDA -->
  <rect x="650" y="55" width="180" height="54" rx="27" fill="#E1EEEA" stroke="#0E5D50" stroke-width="1.6"/>
  <text x="740" y="79" font-size="13.5" font-weight="600" fill="#0E5D50" text-anchor="middle">ATENDIDA</text>
  <text x="740" y="95" font-size="10.5" fill="#47555A" text-anchor="middle">cierre del día</text>

  <path d="M 470 100 L 590 100 L 590 82 L 645 82"
        stroke="#0E5D50" stroke-width="1.6" fill="none" marker-end="url(#flechaVerde)"/>
  <text x="527" y="93" font-size="10.5" fill="#0E5D50" text-anchor="middle">asiste</text>

  <!-- AUSENTE -->
  <rect x="650" y="150" width="180" height="54" rx="27" fill="#F8E8E5" stroke="#A6392B" stroke-width="2"/>
  <text x="740" y="174" font-size="13.5" font-weight="700" fill="#A6392B" text-anchor="middle">AUSENTE</text>
  <text x="740" y="190" font-size="10.5" fill="#A6392B" text-anchor="middle">numerador del indicador</text>

  <path d="M 470 138 L 590 138 L 590 177 L 645 177"
        stroke="#A6392B" stroke-width="1.6" fill="none" marker-end="url(#flechaRoja)"/>
  <text x="527" y="131" font-size="10.5" fill="#A6392B" text-anchor="middle">no asiste ni cancela</text>

  <!-- ============ terminales que liberan el cupo ============ -->

  <!-- CANCELADA -->
  <rect x="110" y="300" width="175" height="54" rx="27" fill="#FFFFFF" stroke="#6B7773" stroke-width="1.6"/>
  <text x="197" y="324" font-size="13.5" font-weight="600" fill="#3C4744" text-anchor="middle">CANCELADA</text>
  <text x="197" y="340" font-size="10.5" fill="#6B7773" text-anchor="middle">con motivo y antelación</text>

  <path d="M 160 190 L 160 295" stroke="#3C4744" stroke-width="1.6" fill="none" marker-end="url(#flecha)"/>
  <text x="168" y="243" font-size="10.5" fill="#3C4744">cancela</text>

  <!-- REPROGRAMADA -->
  <rect x="330" y="300" width="175" height="54" rx="27" fill="#FFFFFF" stroke="#6B7773" stroke-width="1.6"/>
  <text x="417" y="324" font-size="13.5" font-weight="600" fill="#3C4744" text-anchor="middle">REPROGRAMADA</text>
  <text x="417" y="340" font-size="10.5" fill="#6B7773" text-anchor="middle">genera una cita nueva</text>

  <path d="M 417 190 L 417 295" stroke="#3C4744" stroke-width="1.6" fill="none" marker-end="url(#flecha)"/>
  <text x="425" y="243" font-size="10.5" fill="#3C4744">reprograma</text>

  <!-- libera cupo -->
  <rect x="600" y="292" width="250" height="70" rx="6" fill="#E1EEEA" stroke="#0E5D50" stroke-width="1.6"/>
  <text x="725" y="318" font-size="12.5" font-weight="600" fill="#0E5D50" text-anchor="middle">Libera el cupo</text>
  <text x="725" y="336" font-size="11" fill="#0E5D50" text-anchor="middle">se ofrece a la lista de espera</text>
  <text x="725" y="352" font-size="10" fill="#47555A" text-anchor="middle">solo si la antelación ≥ 4 h</text>

  <path d="M 505 327 L 595 327" stroke="#0E5D50" stroke-width="1.6" fill="none" marker-end="url(#flechaVerde)"/>
  <path d="M 197 354 L 197 392 L 725 392 L 725 367"
        stroke="#0E5D50" stroke-width="1.6" fill="none" marker-end="url(#flechaVerde)"/>

  <!-- ============ leyenda ============ -->
  <line x1="50" y1="415" x2="830" y2="415" stroke="#DDE3E4" stroke-width="1"/>

  <rect x="52" y="431" width="13" height="13" rx="3" fill="#F8E8E5" stroke="#A6392B" stroke-width="1.5"/>
  <text x="73" y="442" font-size="11" fill="#3C4744">Variable dependiente de la investigación · Ficha técnica N.° 10</text>

  <rect x="440" y="431" width="13" height="13" rx="3" fill="#E1EEEA" stroke="#0E5D50" stroke-width="1.5"/>
  <text x="461" y="442" font-size="11" fill="#3C4744">Estado terminal · no admite transiciones posteriores</text>

</svg>
