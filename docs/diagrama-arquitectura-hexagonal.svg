<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="920" height="580" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Diagrama de arquitectura hexagonal del sistema: adaptadores de entrada a la izquierda, núcleo con casos de uso y dominio en el centro, adaptadores de salida a la derecha, conectados mediante puertos sobre los bordes del hexágono.">

  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E5D50"/>
    </marker>
    <marker id="flg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C9A96"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="580" fill="#FFFFFF"/>

  <!-- ================= rótulos de lado ================= -->
  <text x="20" y="34" font-size="10.5" fill="#0E5D50" letter-spacing="1.4">LADO DE CONDUCCIÓN · ADAPTADORES DE ENTRADA</text>
  <text x="900" y="34" font-size="10.5" fill="#0E5D50" letter-spacing="1.4" text-anchor="end">LADO CONDUCIDO · ADAPTADORES DE SALIDA</text>

  <!-- ================= hexágono: el núcleo ================= -->
  <polygon points="630,270 540,114 360,114 270,270 360,426 540,426"
           fill="#E9F2F0" stroke="#0E5D50" stroke-width="2"/>

  <text x="450" y="146" font-size="10.5" fill="#0E5D50" text-anchor="middle" letter-spacing="1.3">CASOS DE USO · CAPA DE APLICACIÓN</text>
  <text x="450" y="170" font-size="12" fill="#16211F" text-anchor="middle">RegistrarCita · ConfirmarCita</text>
  <text x="450" y="188" font-size="12" fill="#16211F" text-anchor="middle">CancelarCita · CerrarAsistencia</text>
  <text x="450" y="206" font-size="12" fill="#16211F" text-anchor="middle">DespacharRecordatorios</text>

  <!-- dominio -->
  <rect x="345" y="224" width="210" height="122" rx="4" fill="#FFFFFF" stroke="#0E5D50" stroke-width="1.6"/>
  <text x="450" y="246" font-size="10.5" fill="#0E5D50" text-anchor="middle" letter-spacing="1.3">DOMINIO</text>
  <text x="450" y="270" font-size="12" font-weight="600" fill="#16211F" text-anchor="middle">Cita</text>
  <text x="450" y="288" font-size="12" font-weight="600" fill="#16211F" text-anchor="middle">PoliticaRecordatorios</text>
  <text x="450" y="306" font-size="12" font-weight="600" fill="#16211F" text-anchor="middle">Reloj</text>
  <text x="450" y="330" font-size="10" fill="#6B7773" text-anchor="middle">sin dependencias externas</text>

  <text x="450" y="376" font-size="10.5" fill="#0E5D50" text-anchor="middle">Cobertura 93,77 % · 0 violaciones de dependencia</text>

  <!-- ================= puertos (izquierda) ================= -->
  <rect x="322" y="157" width="17" height="17" fill="#FFFFFF" stroke="#0E5D50" stroke-width="1.6"/>
  <rect x="291" y="210" width="17" height="17" fill="#FFFFFF" stroke="#0E5D50" stroke-width="1.6"/>
  <rect x="291" y="313" width="17" height="17" fill="#FFFFFF" stroke="#0E5D50" stroke-width="1.6"/>
  <rect x="322" y="366" width="17" height="17" fill="#FFFFFF" stroke="#0E5D50" stroke-width="1.6"/>

  <!-- ================= puertos (derecha) ================= -->
  <rect x="561" y="157" width="17" height="17" fill="#FFFFFF" stroke="#0E5D50" stroke-width="1.6"/>
  <rect x="592" y="210" width="17" height="17" fill="#FFFFFF" stroke="#0E5D50" stroke-width="1.6"/>
  <rect x="592" y="313" width="17" height="17" fill="#FFFFFF" stroke="#0E5D50" stroke-width="1.6"/>
  <rect x="561" y="366" width="17" height="17" fill="#FFFFFF" stroke="#0E5D50" stroke-width="1.6"/>

  <!-- ================= adaptadores de entrada ================= -->
  <rect x="20" y="126" width="215" height="52" rx="4" fill="#F4F7F7" stroke="#B8C4C7" stroke-width="1.3"/>
  <text x="34" y="148" font-size="12.5" font-weight="600" fill="#16211F">Interfaz web</text>
  <text x="34" y="165" font-size="10.5" fill="#6B7773">recepción, médico y dirección</text>

  <rect x="20" y="201" width="215" height="52" rx="4" fill="#F4F7F7" stroke="#B8C4C7" stroke-width="1.3"/>
  <text x="34" y="223" font-size="12.5" font-weight="600" fill="#16211F">Controlador HTTP</text>
  <text x="34" y="240" font-size="10.5" fill="#6B7773">API REST</text>

  <rect x="20" y="291" width="215" height="52" rx="4" fill="#F4F7F7" stroke="#B8C4C7" stroke-width="1.3"/>
  <text x="34" y="313" font-size="12.5" font-weight="600" fill="#16211F">n8n · programador</text>
  <text x="34" y="330" font-size="10.5" fill="#6B7773">dispara el despacho cada minuto</text>

  <rect x="20" y="366" width="215" height="52" rx="4" fill="#FFFFFF" stroke="#8C9A96" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="34" y="388" font-size="12.5" font-weight="600" fill="#6B7773">Confirmación del paciente</text>
  <text x="34" y="405" font-size="10.5" fill="#8C9A96">enlace único · pendiente</text>

  <!-- ================= adaptadores de salida ================= -->
  <rect x="685" y="126" width="215" height="52" rx="4" fill="#F4F7F7" stroke="#B8C4C7" stroke-width="1.3"/>
  <text x="699" y="148" font-size="12.5" font-weight="600" fill="#16211F">PostgreSQL 18</text>
  <text x="699" y="165" font-size="10.5" fill="#6B7773">datos y restricciones de integridad</text>

  <rect x="685" y="201" width="215" height="52" rx="4" fill="#F4F7F7" stroke="#B8C4C7" stroke-width="1.3"/>
  <text x="699" y="223" font-size="12.5" font-weight="600" fill="#16211F">n8n → WhatsApp</text>
  <text x="699" y="240" font-size="10.5" fill="#6B7773">envío de recordatorios · simulado</text>

  <rect x="685" y="291" width="215" height="52" rx="4" fill="#F4F7F7" stroke="#B8C4C7" stroke-width="1.3"/>
  <text x="699" y="313" font-size="12.5" font-weight="600" fill="#16211F">Bitácora de auditoría</text>
  <text x="699" y="330" font-size="10.5" fill="#6B7773">Ley N.° 29733 · inalterable</text>

  <rect x="685" y="366" width="215" height="52" rx="4" fill="#FFFFFF" stroke="#8C9A96" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="699" y="388" font-size="12.5" font-weight="600" fill="#6B7773">Pasarela SMS</text>
  <text x="699" y="405" font-size="10.5" fill="#8C9A96">canal de respaldo · pendiente</text>

  <!-- ================= flechas de entrada ================= -->
  <path d="M 235 152 L 318 165" stroke="#0E5D50" stroke-width="1.5" fill="none" marker-end="url(#fl)"/>
  <path d="M 235 227 L 287 218" stroke="#0E5D50" stroke-width="1.5" fill="none" marker-end="url(#fl)"/>
  <path d="M 235 317 L 287 321" stroke="#0E5D50" stroke-width="1.5" fill="none" marker-end="url(#fl)"/>
  <path d="M 235 392 L 318 375" stroke="#8C9A96" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#flg)"/>

  <!-- ================= flechas de salida ================= -->
  <path d="M 582 165 L 681 152" stroke="#0E5D50" stroke-width="1.5" fill="none" marker-end="url(#fl)"/>
  <path d="M 613 218 L 681 227" stroke="#0E5D50" stroke-width="1.5" fill="none" marker-end="url(#fl)"/>
  <path d="M 613 321 L 681 317" stroke="#0E5D50" stroke-width="1.5" fill="none" marker-end="url(#fl)"/>
  <path d="M 582 375 L 681 392" stroke="#8C9A96" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#flg)"/>

  <!-- ================= leyenda ================= -->
  <line x1="20" y1="470" x2="900" y2="470" stroke="#DDE3E4" stroke-width="1"/>

  <rect x="22" y="487" width="15" height="15" fill="#FFFFFF" stroke="#0E5D50" stroke-width="1.6"/>
  <text x="46" y="499" font-size="11" fill="#3C4744">Puerto · interfaz declarada dentro del núcleo e implementada fuera</text>

  <rect x="22" y="514" width="15" height="15" fill="#FFFFFF" stroke="#8C9A96" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="46" y="526" font-size="11" fill="#3C4744">Adaptador previsto, aún no implementado</text>

  <text x="22" y="556" font-size="11" fill="#6B7773">Regla verificada automáticamente: ningún archivo del dominio importa infraestructura ni librerías externas.</text>

</svg>
