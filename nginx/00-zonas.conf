# Zona de limitación para el acceso.
#
# Va en un archivo aparte porque `limit_req_zone` solo es válida en el
# contexto http, no dentro de un `server`. Nginx incluye todos los .conf
# de este directorio dentro de http, así que acá queda en el lugar correcto.
#
# 10 MB alcanzan para unas 160 mil direcciones distintas.

limit_req_zone $binary_remote_addr zone=acceso:10m rate=12r/m;
