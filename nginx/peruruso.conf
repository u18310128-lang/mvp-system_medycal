# =====================================================================
#  Nginx — puerta de entrada del sistema
#
#  Reemplazá  citas.tudominio.pe  por tu dominio real (aparece 4 veces).
# =====================================================================

# ---- HTTP: solo para renovar el certificado y empujar todo a HTTPS ----
server {
    listen 80;
    server_name citas.tudominio.pe;

    # Let's Encrypt deja acá el archivo de verificación. Debe quedar en
    # HTTP: si se redirige, la renovación automática falla en silencio y
    # el sitio se cae a los 90 días.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------- HTTPS -------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name citas.tudominio.pe;

    ssl_certificate     /etc/letsencrypt/live/citas.tudominio.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citas.tudominio.pe/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Obliga al navegador a usar HTTPS durante un año, incluso si alguien
    # escribe la dirección con http://
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 8m;

    # ---- freno a la prueba sistemática de contraseñas ----
    # La aplicación ya bloquea a los 5 intentos por cuenta; esto frena
    # antes, al que rota entre muchas cuentas desde una misma dirección.
    location = /api/auth/login {
        limit_req zone=acceso burst=5 nodelay;
        proxy_pass http://app:3000;
        include /etc/nginx/conf.d/proxy_comun.inc;
    }

    # ---- editor de flujos, detrás de su propia autenticación ----
    location /n8n/ {
        proxy_pass http://n8n:5678/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/conf.d/proxy_comun.inc;
    }

    location / {
        proxy_pass http://app:3000;
        include /etc/nginx/conf.d/proxy_comun.inc;
    }
}
